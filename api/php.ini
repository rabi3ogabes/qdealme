; Extra PHP settings for the Vercel runtime (appended to its php.ini).
memory_limit = 512M
max_execution_time = 60
; Vercel limits request bodies to 4.5 MB; large flyer files go straight to
; cloud storage from the browser instead (see docs/VERCEL.md).
upload_max_filesize = 4M
post_max_size = 4M
expose_php = Off
